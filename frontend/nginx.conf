map $http_x_request_id $upstream_request_id {
    default $http_x_request_id;
    "" $request_id;
}

map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $scheme;
    https https;
}

# These are origin direct-peer caps. Behind TLS termination, the trusted edge
# must apply per-client limits because this origin intentionally does not trust
# caller-supplied forwarding headers.
limit_req_zone $binary_remote_addr zone=api_pre_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=system_routes:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    client_max_body_size 64m;
    limit_req_status 429;

    location ~ ^/api(/|$) {
        limit_req zone=api_pre_auth burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_read_timeout 120s;
    }

    location ~ ^/(health|ready|metrics)(/|$) {
        limit_req zone=system_routes burst=30 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
