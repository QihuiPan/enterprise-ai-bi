name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=backend --cov=data_pipeline --cov=ml --cov-report=term-missing
      - name: Enforce English changelog update
        if: github.event_name == 'pull_request'
        run: python scripts/check_changelog.py --base "origin/${{ github.base_ref }}"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@22
          install: false
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build dashboard
        working-directory: frontend
        run: pnpm build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enterprise_bi_test
          POSTGRES_USER: enterprise_bi
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise_bi -d enterprise_bi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://enterprise_bi:ci-postgres-password@localhost:5432/enterprise_bi_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Verify PostgreSQL is the active test database
        run: python -c "from backend.app.database import engine; assert engine.dialect.name == 'postgresql', engine.url"
      - name: Run PostgreSQL contract and API tests
        run: pytest tests/test_api.py tests/test_validation.py tests/test_encapsulation.py
